spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/hr_platform
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080
  servlet:
    context-path: /

logging:
  level:
    com.localgov: DEBUG
    org.springframework.web: DEBUG
